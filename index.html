<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ebi John & Diya George | Wedding & Betrothal Invitation</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #fcf8f2;
      --card-bg: #ffffff;
      --burgundy: #7a1c24;
      --gold: #c59b27;
      --gold-light: #e6d3a3;
      --text-dark: #2c221e;
      --text-muted: #6e5a53;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      font-family: 'Montserrat', sans-serif;
      line-height: 1.6;
      text-align: center;
      overflow-x: hidden;
    }

    /* Decorative Border Frame */
    .page-frame {
      max-width: 1000px;
      margin: 20px auto;
      padding: 25px 15px;
      border: 2px solid var(--gold);
      background: linear-gradient(180deg, #fffdf9 0%, #f9f3e8 100%);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      position: relative;
    }

    /* Typography */
    h1, h2, h3 {
      font-family: 'Cormorant Garamond', serif;
    }

    .script-title {
      font-family: 'Great Vibes', cursive;
      color: var(--burgundy);
      font-size: 3.8rem;
      font-weight: 400;
      line-height: 1.2;
      margin: 10px 0;
    }

    .subtitle-caps {
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .divider {
      width: 140px;
      height: 2px;
      background: var(--gold);
      margin: 20px auto;
      position: relative;
    }

    .divider::after {
      content: "❖";
      color: var(--gold);
      background: #fcf8f2;
      padding: 0 10px;
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1rem;
    }

    /* Hero Section */
    .hero {
      padding: 40px 20px 20px;
    }

    .hero-photo {
      width: 100%;
      max-width: 460px;
      height: 520px;
      object-fit: cover;
      border-radius: 230px 230px 16px 16px;
      border: 4px solid var(--gold);
      box-shadow: 0 8px 25px rgba(122, 28, 36, 0.15);
      margin: 25px auto;
      display: block;
    }

    .couple-names {
      font-family: 'Great Vibes', cursive;
      font-size: 4.2rem;
      color: var(--burgundy);
      margin: 15px 0 5px;
    }

    .couple-names span {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      color: var(--gold);
      display: block;
      margin: -10px 0;
    }

    /* Countdown Timer */
    .countdown-box {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin: 30px auto;
      max-width: 550px;
    }

    .time-card {
      background: var(--card-bg);
      border: 1px solid var(--gold-light);
      border-radius: 10px;
      padding: 12px 18px;
      min-width: 90px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }

    .time-card span {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--burgundy);
    }

    .time-card small {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    /* Section Containers */
    section {
      padding: 35px 15px;
      max-width: 850px;
      margin: 0 auto;
    }

    .section-heading {
      font-size: 2.3rem;
      color: var(--burgundy);
      margin-bottom: 5px;
    }

    /* Cards Grid */
    .grid-2 {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      margin-top: 25px;
    }

    .card {
      flex: 1;
      min-width: 290px;
      background: var(--card-bg);
      border: 1px solid var(--gold-light);
      border-radius: 14px;
      padding: 28px 22px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
      position: relative;
    }

    .card h3 {
      font-family: 'Great Vibes', cursive;
      font-size: 2.6rem;
      color: var(--burgundy);
      font-weight: 400;
      margin-bottom: 10px;
    }

    .family-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--burgundy);
      margin-bottom: 8px;
    }

    .parents-names {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-dark);
      margin: 6px 0;
    }

    .family-house {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      font-style: italic;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 10px;
    }

    .event-detail {
      margin: 12px 0;
      font-size: 0.98rem;
    }

    .event-detail strong {
      color: var(--burgundy);
    }

    .reception-banner {
      margin-top: 16px;
      padding: 10px;
      background: #fdf6ec;
      border: 1px dashed var(--gold);
      border-radius: 8px;
      font-size: 0.9rem;
    }

    /* Buttons */

      margin-top: 15px;
